name: Deploy Liberty App

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Build WAR
      run: mvn clean package

    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keygen -l -f ~/.ssh/id_ed25519

    - name: Copy WAR
      run: |
        scp -i ~/.ssh/id_ed25519 \
        -o StrictHostKeyChecking=no \
        target/sample.war \
        ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/sample.war

    - name: Deploy WAR
      run: |
        ssh -i ~/.ssh/id_ed25519 \
        -o StrictHostKeyChecking=no \
        ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
        'cp /tmp/sample.war /opt/liberty/wlp/usr/servers/liberty01/dropins/sample.war && ls -l /opt/liberty/wlp/usr/servers/liberty01/dropins/sample        .war'
